<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora: GenAI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              'brand-blue': '#00BFFF',
              'brand-violet': '#6C63FF',
              'slate': {
                300: '#d1d5db',
                400: '#9ca3af',
                500: '#6b7280',
                600: '#4b5563',
                700: '#374151',
                800: '#1f2937',
                900: '#0f172a',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        position: relative;
        overflow-x: hidden;
      }
      
      /* Only show glows in dark mode */
      .dark body::after,
      .dark .corner-glow-br {
        opacity: 0.15;
      }

      body::after,
      .corner-glow-br {
        content: '';
        position: fixed;
        z-index: -1;
        pointer-events: none;
        border-radius: 50%;
        filter: blur(250px);
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      /* Top-left corner light (Violet) */
      body::after {
        width: 35vw;
        height: 35vw;
        min-width: 400px;
        min-height: 400px;
        top: -15%;
        left: -15%;
        background: '#6C63FF';
      }

      /* Bottom-right corner light (Electric Blue) */
      .corner-glow-br {
        width: 35vw;
        height: 35vw;
        min-width: 400px;
        min-height: 400px;
        bottom: -15%;
        right: -15%;
        background: '#00BFFF';
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "recharts": "https://aistudiocdn.com/recharts@^2.12.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 dark:bg-black text-slate-800 dark:text-slate-300 antialiased">
    <div id="root"></div>
    <div class="corner-glow-br"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
